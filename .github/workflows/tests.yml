name: League checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: league-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      python: ${{ steps.select.outputs.python }}
      ui: ${{ steps.select.outputs.ui }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/ci_changes.py select
          else
            python3 scripts/ci_changes.py select --force-full
          fi

  python:
    name: Python league tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run league tests
        run: python -m unittest discover -s tests -v

  ui:
    name: UI interaction tests
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install API dependencies for UI checks
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Install UI check dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: node --check app/static/app.js
      - name: Check UI test runner
        run: npm run test:runner
      - name: Run UI interaction checks
        run: npm run test:ui

  # Keep the original required check name, including on documentation-only PRs.
  tests:
    needs: [changes, python, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify all selected checks passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_SELECTED: ${{ needs.changes.outputs.python }}
          UI_SELECTED: ${{ needs.changes.outputs.ui }}
          PYTHON_RESULT: ${{ needs.python.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: python3 scripts/ci_changes.py verify
